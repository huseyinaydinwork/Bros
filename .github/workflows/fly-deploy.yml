# Deploys bürOS to Fly.io on every push to main (or by hand from the Actions tab).
# Needs the repository secret FLY_API_TOKEN (an org token: fly tokens create org). Without it the job is skipped.
# Each run makes sure the app has a Postgres database and a Tigris bucket, deploys exactly one machine
# and checks /healthz. Output that could contain credentials is filtered, because this repository is public.
name: Fly.io deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: fly-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ADMIN_EMAIL: huseyinaydinwork@gmail.com
      REGION: fra
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: if [ -n "$FLY_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "FLY_API_TOKEN tanımlı değil; yayın atlandı."; fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok
        with:
          node-version: 22
      - name: Syntax check
        if: steps.token.outputs.ok
        run: npm run check
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ok
      - name: Provision database and file storage
        if: steps.token.outputs.ok
        run: |
          set -uo pipefail
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          # Run a command but print only lines that cannot carry credentials.
          quiet(){ "$@" >/tmp/out 2>&1; rc=$?; grep -viE 'postgres(ql)?://|password|secret|key|token' /tmp/out | tail -25 || true; return $rc; }
          echo "== Token kontrolü"
          if ! quiet flyctl status -a "$APP"; then echo "::error::Token '$APP' uygulamasına erişemiyor (FLY_API_TOKEN yanlış ya da başka bir uygulamaya ait)."; exit 1; fi
          SECRETS=$(flyctl secrets list -a "$APP" --json 2>/dev/null | jq -r '.[] | (.Name // .name)' || true)
          echo "Tanımlı ayarlar: $(echo $SECRETS | tr '\n' ' ')"
          ORG=$(flyctl orgs list --json 2>/dev/null | jq -r 'if type=="object" then keys[0] else .[0].Slug // .[0].slug end' 2>/dev/null || true)
          ORG=${ORG:-personal}
          if ! grep -qx DATABASE_URL <<<"$SECRETS"; then
            echo "== PostgreSQL: $APP-db"
            quiet flyctl postgres create --name "$APP-db" --org "$ORG" --region "$REGION" --initial-cluster-size 1 --vm-size shared-cpu-1x --volume-size 10 || echo "::warning::PostgreSQL oluşturulamadı (zaten var olabilir ya da token organizasyon yetkisine sahip değil)."
            quiet flyctl postgres attach "$APP-db" -a "$APP" --yes || echo "::warning::PostgreSQL bağlanamadı. Veriler kalıcı olmayacak; organizasyon token'ı gerekir (fly tokens create org)."
          else echo "PostgreSQL bağlı."; fi
          if ! grep -qx BUCKET_NAME <<<"$SECRETS"; then
            echo "== Dosya deposu (Tigris)"
            quiet flyctl storage create -a "$APP" -o "$ORG" -n "$APP-files" --yes || echo "::warning::Dosya deposu oluşturulamadı; yüklenen dosyalar kalıcı olmayacak."
          else echo "Dosya deposu bağlı."; fi
          if ! grep -qx BUROS_PLATFORM_ADMINS <<<"$SECRETS"; then
            quiet flyctl secrets set -a "$APP" --stage BUROS_PLATFORM_ADMINS="$ADMIN_EMAIL" || echo "::warning::Yönetici ayarı yazılamadı."
          fi
          exit 0
      - name: Deploy
        if: steps.token.outputs.ok
        run: flyctl deploy --remote-only --ha=false --wait-timeout 300
      - name: Keep exactly one machine
        if: steps.token.outputs.ok
        run: flyctl scale count 1 --yes || echo "::warning::Makine sayısı ayarlanamadı."
      - name: Health check
        if: steps.token.outputs.ok
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/healthz"; then echo; echo "Yayında: https://$APP.fly.dev"; exit 0; fi
            sleep 6
          done
          flyctl status; flyctl logs --no-tail | tail -60 | grep -viE 'postgres(ql)?://|password|secret' ; exit 1

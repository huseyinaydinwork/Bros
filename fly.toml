# bürOS on Fly.io. First-time setup: scripts/fly-setup.sh (see DEPLOY.md, "Fly.io").
# The app keeps its working set in memory, so exactly one machine must run: deploy with --ha=false
# and never scale above one. Data lives in Fly Postgres (DATABASE_URL) when attached, otherwise on the
# buros_data volume; files go to Tigris (BUCKET_NAME) when attached, otherwise to the volume.
app = "buros"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  BUROS_DATA_DIR = "/data"

# Persistent disk for data (file backend) and uploads until Postgres / Tigris are attached.
[mounts]
  source = "buros_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
